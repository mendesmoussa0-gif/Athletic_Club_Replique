<!DOCTYPE html>
<html lang="fr-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Académie de Football - ATHLETIC CLUB REPLIQUE</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="shortcut icon" href="img/Captura de ecrã 2025-12-10 073057.png" type="image/x-icon">
</head>
<body>
    <!-- HEADER E NAVEGAÇÃO -->
    <header class="header">
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-futbol">Athletic Club Replique</i> <span>Académie de Football</span>
            </div>
            <ul class="nav-links">
                <li><a href="#home">Accueil</a></li>
                <li><a href="#sobre">À Propos</a></li>
                <li><a href="#servicos">Services</a></li>
                <li><a href="galeria.html">Galerie</a></li>
                <li><a href="#contato">Contact</a></li>
            </ul>
            <button class="menu-toggle">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </nav>
    </header>

    <!-- SECTION HERO -->
    <section class="hero" id="home">
        <div class="hero-content">
            <h1 id="heroTitle"></h1>
            <p id="heroSubtitle"></p>
            <button class="cta-btn" id="ctaButton"></button>
        </div>
        <video autoplay muted loop class="hero-video">
            <source src="" type="video/mp4">
        </video>
    </section>

    <!-- SECTION À PROPOS -->
    <section class="sobre" id="sobre">
        <div class="container">
            <h2 id="aboutTitle"></h2>
            <div class="sobre-content">
                <div class="sobre-text" id="aboutText"></div>
                <div class="sobre-stats" id="aboutStats"></div>
            </div>
        </div>
    </section>

    <!-- SECTION SERVICES -->
    <section class="servicos" id="servicos">
        <div class="container">
            <h2 id="servicesTitle"></h2>
            <div class="servicos-grid" id="servicesGrid"></div>
        </div>
    </section>

    <!-- SECTION GALERIE -->
    <section class="galeria" id="galeria">
        <div class="container">
            <h2 id="galleryTitle"></h2>
            <div class="galeria-grid" id="galleryGrid"></div>
        </div>
    </section>

    <!-- SECTION CONTACT -->
    <section class="contato" id="contato">
        <div class="container">
            <h2 id="contactTitle"></h2>
            <div class="contato-content">
                <div class="contato-info" id="contactInfo"></div>

                <form class="contato-form">
                    <div class="form-group">
                        <input type="text" placeholder="Votre Nom" required>
                    </div>
                    <div class="form-group">
                        <input type="email" placeholder="Votre Email" required>
                    </div>
                    <div class="form-group">
                        <input type="tel" placeholder="Votre Téléphone" required>
                    </div>
                    <div class="form-group">
                        <textarea placeholder="Votre Message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn-enviar">Envoyer un Message</button>
                </form>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="footer">
        <div class="container">
            <div class="footer-content" id="footerContent"></div>
            <div class="footer-bottom">
                <p id="footerCopyright"></p>
            </div>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
